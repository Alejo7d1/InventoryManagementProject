# ============================================================
# DCAVA Backend - Docker Compose (Optimizado para VPS 2GB RAM)
# Levanta el backend Java (Spring Boot) junto a MySQL 8
# con persistencia de datos y límites estrictos de memoria.
# ============================================================

services:

  # ---------- Base de datos MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: dcava-mysql
    restart: unless-stopped
    command: --innodb_buffer_pool_size=128M --max_connections=30 --performance_schema=OFF
    environment:
      # El archivo .env del proyecto aporta estos valores.
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${APP_DB_USER}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      # Vinculado a 127.0.0.1 para acceso local seguro vía Túnel SSH sin exponerlo a Internet
      - "127.0.0.1:3307:3306"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    shm_size: 256mb
    volumes:
      # Volumen con nombre: los datos sobreviven a "docker compose down"
      - mysql-data:/var/lib/mysql
      # Inicialización automática en el primer arranque
      - ./01-create-users.sh:/docker-entrypoint-initdb.d/01-create-users.sh:ro
      - ./02-init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Backend Java (Spring Boot) ----------
  backend:
    build: .
    container_name: dcava-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DATABASE_USER: ${APP_DB_USER}
      DATABASE_PASSWORD: ${APP_DB_PASSWORD}
      PORT: ${APP_PORT}
      # Restringe la memoria Heap de Java a 384M máximo usando Garbage Collector ligero
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    volumes:
      # Persistencia para archivos subidos localmente
      - uploads-data:/app/uploads

# ---------- Volúmenes persistentes ----------
volumes:
  mysql-data:
    name: dcava_mysql_data
  uploads-data:
    name: dcava_uploads_data