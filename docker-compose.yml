services:
  # ==========================
  # Data Base MySQL
  # ==========================
  dcava-db:
    image: mysql:8.1
    container_name: dcava-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-init/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      retries: 10

  # ==========================
  # Backend Spring Boot
  # ==========================
  dcava-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dcava-backend
    restart: always
    depends_on:
      dcava-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}

      APP_PORT: ${APP_PORT}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      FRONTEND_URLS: ${FRONTEND_URLS}

      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    ports:
      - "8080:8080"

  # ==========================
  # Backups DB
  # ==========================
  dcava-db-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: dcava-db-backup
    restart: always
    depends_on:
      dcava-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_USER: ${MYSQL_BACKUP_USER}
      MYSQL_PWD: ${MYSQL_BACKUP_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_KEY}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: ${R2_ENDPOINT}

      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET}
      R2_BACKUP_PREFIX: ${R2_BACKUP_PREFIX}

      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - ./backups:/backups

volumes:
  mysql_data:
