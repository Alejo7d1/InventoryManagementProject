# ============================================================
# DCAVA Backend - Docker Compose (Optimizado para VPS 2GB RAM)
# Levanta el backend Java (Spring Boot) junto a MySQL 8
# con persistencia de datos y límites estrictos de memoria.
# ============================================================

services:

  # ---------- Base de datos MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: dcava-mysql
    restart: unless-stopped
    command: --innodb_buffer_pool_size=128M --max_connections=30 --performance_schema=OFF
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${APP_DB_USER}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      # Vinculado a 127.0.0.1 para acceso local seguro vía Túnel SSH sin exponerlo a Internet
      - "127.0.0.1:3307:3306"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    shm_size: 256mb
    volumes:
      - mysql-data:/var/lib/mysql
      - ./01-create-users.sh:/docker-entrypoint-initdb.d/01-create-users.sh:ro
      - ./02-init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Backend Java (Spring Boot) ----------
  backend:
    build: .
    container_name: dcava-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DATABASE_USER: ${APP_DB_USER}
      DATABASE_PASSWORD: ${APP_DB_PASSWORD}
      PORT: ${APP_PORT}
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      LOG_DIR: /app/logs
    ports:
      # Restringido a localhost
      - "127.0.0.1:${APP_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    # Límites del driver json-file (docker logs): evita que el disco se llene
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    volumes:
      - uploads-data:/app/uploads
      - logs-data:/app/logs

  # ---------- Observabilidad: Loki + Promtail + Grafana ----------
  # Recogen los logs JSON del backend y los muestran en Grafana.
  # Acceso: http://127.0.0.1:3002 (proxy nginx en el VPS) o http://IP:3002
  loki:
    image: grafana/loki:2.9.8
    container_name: dcava-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  promtail:
    image: grafana/promtail:2.9.8
    container_name: dcava-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Acceso al socket de Docker y a los archivos de log de los contenedores
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dcava-grafana
    restart: unless-stopped
    environment:
      # Detrás del proxy nginx (logs.dcavalier.com)
      GF_SERVER_DOMAIN: logs.dcavalier.com
      GF_SERVER_ROOT_URL: https://logs.dcavalier.com
      # Credenciales iniciales (cámbialas en el .env)
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # 3002 en el host (evita choques con el frontend/backend). Solo localhost.
      - "127.0.0.1:3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 160M
        reservations:
          memory: 64M

# ---------- Volúmenes persistentes ----------
volumes:
  mysql-data:
    name: dcava_mysql_data
  uploads-data:
    name: dcava_uploads_data
  logs-data:
    name: dcava_logs_data
  loki-data:
    name: dcava_loki_data
  grafana-data:
    name: dcava_grafana_data
