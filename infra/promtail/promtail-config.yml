# Configuración de Promtail: lee los logs JSON del contenedor dcava-backend
# (vía socket de Docker) y los envía a Loki con etiquetas útiles.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: dcava-backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["dcava-backend"]
    relabel_configs:
      # Etiqueta con el nombre del contenedor (sin la "/" inicial)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      # Desestructurar el JSON que ya emite Logback
      - json:
          expressions:
            level: level
            service: service
            logger_name: logger_name
            requestId: requestId
            uid: uid
            clientIp: clientIp
            method: method
            path: path
      # Etiquetas de baja cardinalidad (NO etiquetar requestId/uid: cardinalidad alta)
      - labels:
          level:
          service:
      # Usar el timestamp del propio backend (evita retrasos de cola)
      - timestamp:
          source: "@timestamp"
          format: RFC3339Nano
      # Guardar solo el mensaje como contenido de la línea
      - output:
          source: message

