# Provisionador de dashboards: carga automáticamente los JSON de la carpeta
# /var/lib/grafana/dashboards (montada desde ./infra/grafana/dashboards).
apiVersion: 1

providers:
  - name: "dcava"
    orgId: 1
    folder: "DCAVA"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards

